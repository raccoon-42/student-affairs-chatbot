<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="840" height="160" role="img" aria-label="How the data stays fresh: a daily scrape of the university sites; only changed sources are parsed by an LLM, embedded and written to Qdrant." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="5.0" y="34.0" width="150" height="52" rx="26.0" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="80" y="57" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">University sites</text>
<text x="80" y="75" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">PDF + HTML</text>
<path d="M155,60 L243,60" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<text x="199" y="50" font-size="11" font-weight="400" text-anchor="middle" fill="#9198a1">daily</text>
<polygon points="305,28.0 365.0,60 305,92.0 245.0,60" fill="#151b23" stroke="#3d444d"/>
<text x="305" y="65" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Changed?</text>
<path d="M365,60 L433,60" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<text x="399" y="50" font-size="11" font-weight="400" text-anchor="middle" fill="#9198a1">yes</text>
<rect x="435.0" y="34.0" width="130" height="52" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="500" y="57" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">LLM parser</text>
<text x="500" y="75" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">Sonnet 5.5</text>
<path d="M565,60 L603,60" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="605.0" y="34.0" width="130" height="52" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="670" y="57" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Embed</text>
<text x="670" y="75" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">dense + BM25</text>
<path d="M735,60 L757,60" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<path d="M757.0,37.0 A38.0,7 0 0 1 833.0,37.0 V83.0 A38.0,7 0 0 1 757.0,83.0 Z" fill="#151b23" stroke="#3d444d"/><path d="M757.0,37.0 A38.0,7 0 0 0 833.0,37.0" fill="none" stroke="#3d444d"/>
<text x="795" y="69" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Qdrant</text>
<path d="M305,92 L305,118" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<text x="313" y="108" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">no</text>
<rect x="260.0" y="120.0" width="90" height="32" rx="16.0" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="305" y="141" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Skip</text>
</svg>
