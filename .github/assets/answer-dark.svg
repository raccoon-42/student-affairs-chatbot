<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-label="How İyteBot answers a question: rewrite, scope gate and hybrid search start together; routing, a prompt with [n]-marked chunks, the answer model, a citation check, and the answer with source chips." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="280.0" y="10.0" width="200" height="40" rx="20.0" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="380" y="35" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Student question</text>
<path d="M380,50 L380,96" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<path d="M380,72 L110,72 L110,96" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<path d="M380,72 L640,72 L640,96" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="25.0" y="96.0" width="170" height="56" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="110" y="121" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Rewrite</text>
<text x="110" y="139" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">standalone question</text>
<rect x="295.0" y="96.0" width="170" height="56" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="380" y="121" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Scope gate</text>
<text x="380" y="139" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">on topic?</text>
<rect x="540.0" y="96.0" width="200" height="56" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="640" y="121" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Hybrid search</text>
<text x="640" y="139" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">dense + BM25, 9 collections</text>
<path d="M195,124 L295,124" fill="none" stroke="#9198a1" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/>
<text x="245" y="150" font-size="11" font-weight="400" text-anchor="middle" fill="#9198a1">words changed:</text>
<text x="245" y="164" font-size="11" font-weight="400" text-anchor="middle" fill="#9198a1">gate + search rerun</text>
<path d="M640,152 L640,184" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="540.0" y="184.0" width="200" height="56" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="640" y="209" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Routing</text>
<text x="640" y="227" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">drop far-off collections</text>
<path d="M320,152 L320,212 L186,212" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="35.0" y="194.0" width="150" height="36" rx="18.0" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="110" y="217" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Refusal</text>
<text x="253" y="204" font-size="11" font-weight="400" text-anchor="middle" fill="#9198a1">off topic</text>
<path d="M380,152 L380,272" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<text x="388" y="216" font-size="11" font-weight="400" text-anchor="start" fill="#9198a1">ok</text>
<path d="M640,240 L640,300 L561,300" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="200.0" y="272.0" width="360" height="56" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="380" y="297" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Prompt</text>
<text x="380" y="315" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">chunks marked [n], today, current term</text>
<path d="M380,328 L380,356" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="250.0" y="356.0" width="260" height="56" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="380" y="381" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Answer model</text>
<text x="380" y="399" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">Claude Haiku 5.5, streamed</text>
<path d="M380,412 L380,440" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="230.0" y="440.0" width="300" height="56" rx="8" fill="#151b23" stroke="#4493f8" stroke-width="1.5"/>
<text x="380" y="465" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Citation check</text>
<text x="380" y="483" font-size="12" font-weight="400" text-anchor="middle" fill="#9198a1">drop, move or add [n] markers</text>
<path d="M380,496 L380,524" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#head)"/>
<rect x="250.0" y="524.0" width="260" height="40" rx="20.0" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="380" y="549" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Answer with source chips</text>
</svg>
